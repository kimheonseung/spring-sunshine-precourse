spring:
  application:
    name: spring-sunshine

  ai:
    google:
      genai:
        project-id: gen-lang-client-0556881956
        api-key:
        chat:
          options:
            model: gemini-2.5-flash-lite

  datasource:
    url: jdbc:mysql://localhost:3306/weather?useSSL=false&allowPublicKeyRetrieval=true
    username: weather
    password: weather
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  servlet:
    encoding:
      # Spring Boot 3.x는 RFC 7159에 따라 JSON 응답에 charset을 명시하지 않음
      # Safari 등 일부 브라우저 호환성을 위해 charset=UTF-8 강제 명시
      force-response: true
